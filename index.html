<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fontes usadas na página -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Fonte dos ícones usados na página-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Arquivo de estilização -->
    <link rel="stylesheet" href="css/style.css">
    <title>Trilhas Literárias</title>
</head>

<body>

    <!-- Scripts -->
    <script src="js/script.js"></script>

    <!-- Cabeçalho  -->
    <header class="site-header">
    <div class="container header-inner">
        <div class="logo">
            📖 Trilhas Literárias
        </div>
        <div style="display: flex; align-items: center;">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar livro" autocomplete="off">
            </div>
            <div class="filter-wrapper">
                <button class="filter-toggle" id="filterToggleBtn" aria-label="Filtrar por gênero">
                    <i class="fas fa-sliders-h"></i>
                </button>
                <div class="genre-dropdown" id="genreDropdown">
                    <!-- opções serão inseridas via js -->
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Conteúdo principal -->
<main class="container">
    <div class="hero">
        <h2>Livros são passaportes</h2>
        <p>resenhas sinceras para te ajudar a encontrar sua próxima leitura</p>
    </div>
    <div id="reviewsGrid" class="reviews-grid"></div>
</main>

<!-- Rodapé -->
<footer>
    <div class="container">
        <p>© Trilhas Literárias — inspiração para sua próxima leitura</p>
    </div>
</footer>

<div id="reviewModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3 id="modalBookTitle" class="modal-book-title"></h3>
        <div id="modalAuthor" style="color:#8b6c45; margin-bottom: 8px; font-size:0.9rem;"></div>
        <div id="modalGenreBadge" style="display:inline-block; background:#f0e8df; padding:3px 12px; border-radius:20px; font-size:0.7rem; margin-bottom: 16px;"></div>
        <div id="modalFullReview" class="full-review-text"></div>
        <div id="modalRating" style="margin-top: 12px; color:#e6b84e;"></div>
    </div>
</div>
</body>

</html>
